name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          CURRENT_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          VERSION="${CURRENT_VERSION}-${GITHUB_SHA::7}"

          awk -v version="$VERSION" '
            /^version=/ {
              print "version=" version
              next
            }
            { print }
          ' gradle.properties > gradle.properties.tmp

          mv gradle.properties.tmp gradle.properties

          echo "Building version: $VERSION"
          grep "^version=" gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: ./gradlew build

      - name: Package
        shell: bash
        run: ./gradlew jpackage

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: musmeta-${{ matrix.os }}
          path: |
            build/libs/**
            build/jpackage/**
            build/jpackageImage/**