name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            VERSION="${VERSION#v}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '${VERSION}'. Update the VERSION file." >&2
            exit 1
          fi

          TAG="v${VERSION}"

          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          SHOULD_RELEASE=true
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
              if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
                echo "Tag ${TAG} already points to ${TAG_COMMIT}."
                echo "Bump VERSION before pushing to main to create a new release."
                SHOULD_RELEASE=false
              fi
            fi
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD_RELEASE}" >> "${GITHUB_OUTPUT}"

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"
          echo "Pre-release: ${PRERELEASE}"
          echo "Will release: ${SHOULD_RELEASE}"

      - name: Report skipped release
        if: steps.version.outputs.should_release != 'true'
        shell: bash
        run: |
          echo "### Release skipped" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Tag \`${{ steps.version.outputs.tag }}\` already exists." >> "${GITHUB_STEP_SUMMARY}"
          echo "Bump \`VERSION\` and push to \`main\` to create a new release." >> "${GITHUB_STEP_SUMMARY}"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Linux Packaging Tools
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot file desktop-file-utils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true
          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp && rm -rf squashfs-root && ./appimagetool --appimage-extract
          sudo rm -rf /opt/appimagetool
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Build distributions
        shell: bash
        env:
          MUSMETA_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./gradlew clean build -Pversion="${MUSMETA_VERSION}"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: musmeta-${{ needs.prepare.outputs.version }}-${{ matrix.os }}
          path: build/dist/**

  release:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: MusMeta ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/**/*
