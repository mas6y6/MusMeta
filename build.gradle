plugins {
    id 'java'
    id 'application'
    id 'org.beryx.runtime' version '2.0.1'
}

group = 'com.mas6y6'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    implementation("com.formdev:flatlaf:$flatlaf")
    implementation("com.formdev:flatlaf-extras:$flatlaf")
    implementation("org.apache.commons:commons-lang3:$commonslang3")
    implementation("com.fasterxml.jackson.core:jackson-databind:$jackson")
    implementation("com.google.code.gson:gson:$json")
    implementation("com.github.Dansoftowner:jSystemThemeDetector:$jSystemThemeDetector")
    implementation("org.jetbrains:annotations:26.0.2")

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.mas6y6.musmeta.Main'
}

test {
    useJUnitPlatform()
}

tasks.named('run') {
    systemProperty 'debug', 'true'
}

runtime {
    // ------------------------------------------------------------
    // jlink
    // ------------------------------------------------------------

    options.set([
            '--strip-debug',
            '--compress', '2',
            '--no-header-files',
            '--no-man-pages'
    ])

    modules.set([
            'java.base',
            'java.desktop',
            'java.logging',
            'java.naming',
            'java.xml'
    ])

    // ------------------------------------------------------------
    // Application launcher
    // ------------------------------------------------------------

    launcher {
        noConsole = true
    }

    // ------------------------------------------------------------
    // jpackage
    // ------------------------------------------------------------

    jpackage {
        imageName = 'MusMeta'
        installerName = 'MusMeta'
        appVersion = project.version.toString()

        def osName = System.getProperty('os.name').toLowerCase()
        def isWindows = osName.contains('windows')
        def isMac = osName.contains('mac')
        def isLinux = osName.contains('linux')

        // --------------------------------------------------------
        // Windows
        // --------------------------------------------------------

        if (isWindows) {
            imageOptions.addAll([
                    '--icon',
                    file('src/main/resources/icon.ico').absolutePath
            ])

            installerType = 'msi'

            installerOptions.addAll([
                    '--win-menu',
                    '--win-shortcut',
                    '--win-menu-group', 'MusMeta',
                    '--win-per-user-install',
                    '--win-dir-chooser',
                    '--win-upgrade-uuid',
                    '1f08f358-284b-4982-8495-6dbe3e9cd7bc'
            ])
        }

        // --------------------------------------------------------
        // macOS
        // --------------------------------------------------------

        else if (isMac) {
            def icnsIcon = file('src/main/resources/icon.icns')

            if (icnsIcon.exists()) {
                imageOptions.addAll([
                        '--icon',
                        icnsIcon.absolutePath
                ])
            } else {
                imageOptions.addAll([
                        '--icon',
                        file('src/main/resources/icon.png').absolutePath
                ])
            }

            installerType = 'dmg'

            installerOptions.addAll([
                    '--mac-package-name',
                    'MusMeta',

                    '--mac-package-identifier',
                    group.toString()
            ])
        }

        // --------------------------------------------------------
        // Linux
        // --------------------------------------------------------

        else if (isLinux) {
            imageOptions.addAll([
                    '--icon',
                    file('src/main/resources/icon.png').absolutePath
            ])

            installerType = 'deb'

            installerOptions.addAll([
                    '--linux-menu-group',
                    'Development',

                    '--linux-shortcut'
            ])
        }

        // --------------------------------------------------------
        // Common installer options
        // --------------------------------------------------------

        installerOptions.addAll([
                '--vendor',
                'mas6y6'
        ])
    }
}