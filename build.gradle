plugins {
    id 'java'
    id 'application'
    id 'org.beryx.runtime' version '2.0.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

import org.jetbrains.gradle.ext.Application

group = 'com.mas6y6'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

application {
    mainClass = 'com.mas6y6.musmeta.Bootstrap'
}

idea.project.settings.runConfigurations {
    'App'(Application) {
        mainClass = 'com.mas6y6.musmeta.Bootstrap'
        moduleName = project.idea.module.name + '.main'
        programParameters = '--debug'
        jvmArgs = '-Xmx1G'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    implementation("com.google.guava:guava:$guava")
    implementation("org.spongepowered:mixin:$mixin")

    implementation("com.formdev:flatlaf:$flatlaf")
    implementation("com.formdev:flatlaf-extras:$flatlaf")

    implementation("org.apache.commons:commons-lang3:$commonslang3")
    implementation("com.fasterxml.jackson.core:jackson-databind:$jackson")
    implementation("com.google.code.gson:gson:$json")

    implementation("com.github.Dansoftowner:jSystemThemeDetector:$jSystemThemeDetector")
    implementation("org.jetbrains:annotations:$annotations")
    implementation("info.picocli:picocli:$picocli")

    implementation("org.slf4j:slf4j-api:$slf4j")
    implementation("org.slf4j:slf4j-simple:$slf4j")

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}


// ============================================================
// Shadow JAR
// ============================================================

tasks.named('shadowJar') {
    archiveBaseName = 'MusMeta'
    archiveVersion = project.version
    archiveClassifier = 'all'

    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
    }
}


// ============================================================
// Resources
// ============================================================

tasks.named('processResources') {
    filesMatching('musmeta.properties') {
        expand(version: project.version)
    }
}


// ============================================================
// Runtime / jlink / jpackage
// ============================================================

runtime {

    // --------------------------------------------------------
    // jlink
    // --------------------------------------------------------

    options.set([
            '--strip-debug',
            '--compress', '2',
            '--no-header-files',
            '--no-man-pages'
    ])

    modules.set([
            'java.base',
            'java.desktop',
            'java.logging',
            'java.naming',
            'java.xml'
    ])

    // --------------------------------------------------------
    // Application launcher
    // --------------------------------------------------------

    launcher {
        noConsole = true
    }

    // --------------------------------------------------------
    // jpackage
    // --------------------------------------------------------

    jpackage {
        imageName = 'MusMeta'
        installerName = 'MusMeta'

        mainJar = "MusMeta-${project.version}-all.jar"
        mainClass = 'com.mas6y6.musmeta.Bootstrap'

        appVersion = project.version.toString()

        outputDir = 'jpackage'

        def osName = System.getProperty('os.name').toLowerCase()

        def isWindows = osName.contains('windows')
        def isMac = osName.contains('mac')
        def isLinux = osName.contains('linux')

        // ----------------------------------------------------
        // Windows
        // ----------------------------------------------------

        if (isWindows) {
            def icon = file('src/main/resources/icon.ico')

            if (icon.exists()) {
                imageOptions.addAll([
                        '--icon',
                        icon.absolutePath
                ])
            }

            installerType = 'msi'

            installerOptions.addAll([
                    '--win-menu',
                    '--win-shortcut',
                    '--win-menu-group', 'MusMeta',
                    '--win-per-user-install',
                    '--win-dir-chooser',
                    '--win-upgrade-uuid',
                    '1f08f358-284b-4982-8495-6dbe3e9cd7bc'
            ])
        }

        // ----------------------------------------------------
        // macOS
        // ----------------------------------------------------

        else if (isMac) {
            def icon = file('src/main/resources/icon.icns')

            if (icon.exists()) {
                imageOptions.addAll([
                        '--icon',
                        icon.absolutePath
                ])
            }

            installerType = 'dmg'

            installerOptions.addAll([
                    '--mac-package-name',
                    'MusMeta',
                    '--mac-package-identifier',
                    group.toString()
            ])
        }

        // ----------------------------------------------------
        // Linux
        // ----------------------------------------------------

        else if (isLinux) {
            def icon = file('src/main/resources/icon.png')

            if (icon.exists()) {
                imageOptions.addAll([
                        '--icon',
                        icon.absolutePath
                ])
            }

            installerType = 'deb'

            installerOptions.addAll([
                    '--linux-menu-group',
                    'Development',
                    '--linux-shortcut'
            ])
        }

        // ----------------------------------------------------
        // Common
        // ----------------------------------------------------

        installerOptions.addAll([
                '--vendor',
                'mas6y6'
        ])
    }
}


// ============================================================
// jpackage dependencies
// ============================================================

// Shadow JAR → jpackage image
tasks.named('jpackageImage') {
    dependsOn tasks.named('shadowJar')
}

// ============================================================
// Portable application
// ============================================================

tasks.register('copyJpackage', Copy) {
    dependsOn tasks.named('jpackage')

    from(layout.buildDirectory.dir('jpackage/MusMeta')) {
        include '**/*'
    }

    into(layout.buildDirectory.dir('portable/MusMeta'))
}

// ============================================================
// Portable ZIP
// ============================================================

tasks.register('createPortableApplication', Zip) {
    dependsOn tasks.named('copyJpackage')

    archiveFileName = "MusMeta-${project.version}-portable.zip"

    destinationDirectory = layout.buildDirectory.dir('artifacts')

    from(layout.buildDirectory.dir('portable/MusMeta')) {
        include '**/*'
    }
}


// ============================================================
// Collect final distributions
// ============================================================

tasks.register('collectDistributions', Copy) {

    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('jpackage')
    dependsOn tasks.named('createPortableApplication')

    into(layout.buildDirectory.dir('dist'))

    // --------------------------------------------------------
    // Fat JAR
    // --------------------------------------------------------

    from(tasks.named('shadowJar'))

    // --------------------------------------------------------
    // Installer
    // --------------------------------------------------------

    from(layout.buildDirectory.dir('jpackage')) {
        include '*.msi'
        include '*.dmg'
        include '*.deb'
    }

    // --------------------------------------------------------
    // Portable ZIP
    // --------------------------------------------------------

    from(layout.buildDirectory.dir('artifacts')) {
        include "MusMeta-${project.version}-portable.zip"
    }
}


// ============================================================
// Build lifecycle
// ============================================================

tasks.named('build') {
    dependsOn tasks.named('collectDistributions')
}