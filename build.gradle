plugins {
    id 'java'
    id 'application'
    id 'org.beryx.runtime' version '2.0.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

import org.jetbrains.gradle.ext.Application

group = 'com.mas6y6'

def cliVersion = gradle.startParameter.projectProperties['version']

def git = { List<String> args ->
    try {
        def proc = new ProcessBuilder(['git'] + args)
                .redirectErrorStream(true)
                .start()
        def output = proc.inputStream.text
        def code = proc.waitFor()
        [exitValue: code, output: output.trim()]
    } catch (Exception e) {
        [exitValue: -1, output: '']
    }
}

if (cliVersion) {
    version = cliVersion
} else {
    def tag = git(['describe', '--tags', '--exact-match'])
    def commit = git(['rev-parse', '--short', 'HEAD'])

    if (tag.exitValue == 0 && tag.output) {
        version = tag.output
    } else if (commit.exitValue == 0 && commit.output) {
        version = "Homebuilt - #${commit.output}"
    } else {
        version = 'HOMEBUILT'
    }
}

def numericVersion = (version =~ /\d+(?:\.\d+)*/).find() ?: '0.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

application {
    mainClass = 'com.mas6y6.musmeta.launch.Launcher'
}

// ============================================================
// Plugin sync on run
// ============================================================

idea.project.settings.runConfigurations {
    'App'(Application) {
        mainClass = 'com.mas6y6.musmeta.launch.Launcher'
        moduleName = project.idea.module.name + '.main'
        programParameters = '--debug'
        jvmArgs = '-Xmx1G'
    }
}

def cleanRunResources = tasks.register('cleanRunResources') {
    description = 'Deletes processed resources so the application always starts with freshly expanded resources.'
    doLast {
        delete layout.buildDirectory.dir('resources/main')
    }
}

tasks.named('run') {
    dependsOn cleanRunResources
}

tasks.named('processResources') {
    mustRunAfter cleanRunResources
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.fabricmc.net/'}
}

dependencies {
    implementation project(':plugins:framework')

    implementation("com.google.guava:guava:$guava")

    implementation("com.formdev:flatlaf:$flatlaf")
    implementation("com.formdev:flatlaf-extras:$flatlaf")

    implementation("org.apache.commons:commons-lang3:$commonslang3")
    implementation("com.fasterxml.jackson.core:jackson-databind:$jackson")
    implementation("com.google.code.gson:gson:$json")

    implementation("com.github.Dansoftowner:jSystemThemeDetector:$jSystemThemeDetector")
    implementation("org.jetbrains:annotations:$annotations")
    implementation("info.picocli:picocli:$picocli")

    implementation("com.vladsch.flexmark:flexmark-all:$flexmark")

    implementation("org.slf4j:slf4j-api:$slf4j")
    implementation("org.slf4j:slf4j-simple:$slf4j")

    implementation("com.github.RouHim:jaudiotagger:$jAudioTagger")

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'musmeta.test', 'true'
    systemProperty 'musmeta.config', "${layout.buildDirectory.get().asFile}/test-config/config.json"
    systemProperty 'musmeta.logs.dir', "${layout.buildDirectory.get().asFile}/test-logs"
}

// ============================================================
// Shadow JAR
// ============================================================

tasks.named('shadowJar') {
    archiveBaseName = 'MusMeta'
    archiveVersion = project.version
    archiveClassifier = 'all'

    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
        attributes(['Implementation-Version': asm], 'org/objectweb/asm/')
    }
}

tasks.register('fatJar') {
    group = 'distribution'
    description = 'Builds the self-contained MusMeta JAR.'
    dependsOn tasks.named('shadowJar')
}


// ============================================================
// Resources
// ============================================================

tasks.named('processResources') {
    filesMatching('musmeta.properties') {
        expand(version: project.version)
    }

    filesMatching('about.md') {
        expand(version: project.version)
    }
}


// ============================================================
// Runtime / jlink / jpackage
// ============================================================

runtime {

    // --------------------------------------------------------
    // jlink
    // --------------------------------------------------------

    options.set([
            '--strip-debug',
            '--compress', '2',
            '--no-header-files',
            '--no-man-pages'
    ])


    modules.set([
            // Core
            'java.base',

            // Swing / AWT
            'java.desktop',

            // Logging
            'java.logging',

            // Networking / HTTP
            'java.net.http',
            'java.naming',

            // XML
            'java.xml',

            // SQL / JDBC
            'java.sql',

            // Cryptography / TLS
            'jdk.crypto.ec',
            'jdk.crypto.cryptoki',

            // ZIP / compression
            'jdk.zipfs',

            // Preferences
            'java.prefs',

            // Management / monitoring
            'java.management'
    ])

    // --------------------------------------------------------
    // Application launcher
    // --------------------------------------------------------

    launcher {
        noConsole = true
    }

    // --------------------------------------------------------
    // jpackage
    // --------------------------------------------------------

    jpackage {
        imageName = 'MusMeta'
        installerName = 'MusMeta'

        mainJar = "MusMeta-${project.version}-all.jar"
        mainClass = 'com.mas6y6.musmeta.launch.Launcher'

        appVersion = numericVersion

        outputDir = 'jpackage'

        def osName = System.getProperty('os.name').toLowerCase()

        def isWindows = osName.contains('windows')
        def isMac = osName.contains('mac')
        def isLinux = osName.contains('linux')

        // ----------------------------------------------------
        // Windows
        // ----------------------------------------------------

        if (isWindows) {
            def icon = file('src/main/resources/icon.ico')

            if (icon.exists()) {
                imageOptions.addAll([
                        '--icon',
                        icon.absolutePath
                ])
            }

            installerType = 'msi'

            installerOptions.addAll([
                    '--win-menu',
                    '--win-shortcut',
                    '--win-menu-group', 'MusMeta',
                    '--win-per-user-install',
                    '--win-dir-chooser',
                    '--win-upgrade-uuid',
                    '1f08f358-284b-4982-8495-6dbe3e9cd7bc'
            ])
        }

        // ----------------------------------------------------
        // macOS
        // ----------------------------------------------------

        else if (isMac) {
            def icon = file('src/main/resources/icon.icns')

            if (icon.exists()) {
                imageOptions.addAll([
                        '--icon',
                        icon.absolutePath
                ])
            }

            installerType = 'dmg'

            installerOptions.addAll([
                    '--mac-package-name',
                    'MusMeta',
                    '--mac-package-identifier',
                    group.toString()
            ])
        }

        // ----------------------------------------------------
        // Linux
        // ----------------------------------------------------

        else if (isLinux) {
            def icon = file('src/main/resources/icon.png')

            if (icon.exists()) {
                imageOptions.addAll([
                        '--icon',
                        icon.absolutePath
                ])
            }

            installerType = 'deb'

            installerOptions.addAll([
                    '--linux-menu-group',
                    'Development',
                    '--linux-shortcut'
            ])
        }

        // ----------------------------------------------------
        // Common
        // ----------------------------------------------------

        installerOptions.addAll([
                '--vendor',
                'mas6y6'
        ])
    }
}


// ============================================================
// jpackage dependencies
// ============================================================

// Shadow JAR → jpackage image
tasks.named('jpackageImage') {
    dependsOn tasks.named('shadowJar')
}

// ============================================================
// Portable application
// ============================================================

def hostOsName = System.getProperty('os.name').toLowerCase()
def hostPlatform = hostOsName.contains('windows') ? 'windows' :
        hostOsName.contains('mac') ? 'macos' :
                hostOsName.contains('linux') ? 'linux' : 'portable'
def isHostLinux = hostOsName.contains('linux')
def nativeInstallerSupported = hostOsName.contains('windows') || hostOsName.contains('mac') || hostOsName.contains('linux')

// ============================================================
// Portable ZIP
// ============================================================

tasks.register('portableZip', Zip) {
    group = 'distribution'
    description = 'Creates an install-free application archive with its bundled runtime.'
    // jpackage owns the application-image output directory as well as the
    // platform installer, so depend on it to keep Gradle's task validation
    // and archive contents deterministic.
    dependsOn tasks.named('jpackage')

    archiveFileName = "MusMeta-${project.version}-${hostPlatform}-portable.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    from(layout.buildDirectory.dir('jpackage/MusMeta')) {
        into('MusMeta')
    }
}

tasks.register('createPortableApplication') {
    group = 'distribution'
    description = 'Compatibility alias for portableZip.'
    dependsOn tasks.named('portableZip')
}

// ============================================================
// AppImage (Linux)
// ============================================================

tasks.register('appImage') {
    group = 'distribution'
    description = 'Creates a standalone AppImage for Linux.'
    if (nativeInstallerSupported) {
        dependsOn tasks.named('jpackage')
    }

    def appDir = layout.buildDirectory.dir('appimage/MusMeta.AppDir')
    def appImageOutputDir = layout.buildDirectory.dir('appimage')
    def outputAppImageName = "MusMeta-${project.version}-x86_64.AppImage"

    inputs.dir(layout.buildDirectory.dir('jpackage/MusMeta'))
    inputs.file('src/main/resources/icon.png')
    outputs.file(appImageOutputDir.map { it.file(outputAppImageName) })

    onlyIf {
        isHostLinux
    }

    doLast {
        def appDirFile = appDir.get().asFile
        appDirFile.deleteDir()
        appDirFile.mkdirs()

        // 1. Copy jpackage app-image contents
        project.copy {
            from layout.buildDirectory.dir('jpackage/MusMeta')
            into appDirFile
        }

        // 2. Copy icon
        def iconFile = file('src/main/resources/icon.png')
        if (iconFile.exists()) {
            project.copy {
                from iconFile
                into appDirFile
                rename { 'MusMeta.png' }
            }
            project.copy {
                from iconFile
                into appDirFile
                rename { '.DirIcon' }
            }
        }

        // 3. Create desktop file
        def desktopFile = new File(appDirFile, 'MusMeta.desktop')
        desktopFile.text = """[Desktop Entry]
Type=Application
Name=MusMeta
Comment=MusMeta Music Metadata Editor
Exec=MusMeta
Icon=MusMeta
Categories=AudioVideo;Audio;
Terminal=false
StartupWMClass=MusMeta
"""

        // 4. Create AppRun script
        def appRunFile = new File(appDirFile, 'AppRun')
        appRunFile.text = """#!/bin/sh
APPDIR="\$(dirname "\$(readlink -f "\$0")")"
exec "\$APPDIR/bin/MusMeta" "\$@"
"""

        // Ensure executable permissions
        fileTree(appDirFile).matching {
            include 'AppRun'
            include 'bin/*'
            include 'runtime/bin/*'
            include 'lib/runtime/bin/*'
        }.each { f ->
            f.setExecutable(true, false)
        }

        // 5. Run appimagetool
        def outputDirFile = appImageOutputDir.get().asFile
        outputDirFile.mkdirs()
        def outputFile = new File(outputDirFile, outputAppImageName)

        def appimageToolCmd = System.getenv('APPIMAGETOOL') ?: 'appimagetool'
        def processBuilder = new ProcessBuilder(appimageToolCmd, appDirFile.absolutePath, outputFile.absolutePath)
        processBuilder.environment().put('ARCH', 'x86_64')
        processBuilder.inheritIO()
        def process = processBuilder.start()
        int exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("appimagetool failed with exit code ${exitCode}")
        }
    }
}


// ============================================================
// Collect final distributions
// ============================================================

tasks.register('collectDistributions', Copy) {

    dependsOn tasks.named('shadowJar')
    if (isHostLinux) {
        dependsOn tasks.named('appImage')
    } else {
        dependsOn tasks.named('portableZip')
    }
    if (nativeInstallerSupported) {
        dependsOn tasks.named('jpackage')
    }

    into(layout.buildDirectory.dir('dist'))

    // --------------------------------------------------------
    // Fat JAR
    // --------------------------------------------------------

    from(tasks.named('shadowJar'))

    // --------------------------------------------------------
    // Installer
    // --------------------------------------------------------

    from(layout.buildDirectory.dir('jpackage')) {
        include '*.msi'
        include '*.dmg'
        include '*.deb'
        include '*.rpm'
    }

    // --------------------------------------------------------
    // AppImage
    // --------------------------------------------------------

    from(layout.buildDirectory.dir('appimage')) {
        include '*.AppImage'
    }
}


// ============================================================
// Build lifecycle
// ============================================================

tasks.named('build') {
    dependsOn tasks.named('collectDistributions')
}
