plugins {
    id 'java'
    id 'application'
}

group = 'com.mas6y6'

application {
    mainClass = 'com.mas6y6.musmeta.Main'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation("com.formdev:flatlaf:$flatlaf")
    implementation("com.google.code.gson:gson:$json")
    implementation("com.github.Dansoftowner:jSystemThemeDetector:$jSystemThemeDetector")
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation("org.jetbrains:annotations:26.0.2")
}

test {
    useJUnitPlatform()
}

tasks.named('run') {
    systemProperty 'debug', 'true'
}
